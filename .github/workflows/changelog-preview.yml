name: Changelog Preview

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  merge_group:
    branches: [main, development]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  workspace:
    name: Detect Workspace Bumps
    uses: ./.github/workflows/_workspace-bump-preview.yml

  preview:
    name: Preview Changelog
    needs: [workspace]
    if: |
      always() &&
      (needs.workspace.result == 'success' || needs.workspace.result == 'skipped') &&
      (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'merge_group' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
         (contains(github.event.comment.body, '## Override Changelog') || contains(github.event.comment.body, '## Bump')))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch All Tags
        run: git fetch --tags --force origin '+refs/tags/*:refs/tags/*'

      - name: Prepare Tag for Preview
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1)
          if [ -n "$LATEST_TAG" ]; then
            MERGE_BASE=$(git merge-base HEAD "$LATEST_TAG" 2>/dev/null || git rev-parse HEAD^)
            git tag -f "$LATEST_TAG" "$MERGE_BASE"
          fi
          echo "{\"version\":\"${LATEST_TAG:-v0.0.0}\"}" > version.json

      - name: Install changelog dependencies
        run: |
          npm install --no-save --no-package-lock conventional-changelog-conventionalcommits@7.0.2

      - name: Generate Changelog Preview
        id: changelog
        continue-on-error: true
        uses: TriPSs/conventional-changelog-action@v6
        with:
          skip-commit: true
          skip-tag: true
          skip-version-file: true
          skip-git-pull: true
          skip-on-empty: false
          git-push: false
          output-file: "CHANGELOG_PREVIEW.md"
          release-count: 1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config-file-path: ./.github/.config.cjs
          version-file: ./version.json
          preset: conventionalcommits

      - name: Save changelog outputs
        run: |
          echo '${{ steps.changelog.outputs.tag }}' > /tmp/next_tag.txt
          echo '${{ steps.changelog.outputs.skipped }}' > /tmp/skipped.txt

      - name: Read changelog mode
        id: mode
        run: |
          MODE=$(cat .github/changelog-mode 2>/dev/null || echo auto)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Materialize manual release body
        if: steps.mode.outputs.mode == 'manual'
        run: |
          if [ -s /tmp/next_tag.txt ] && [ -f CHANGELOG.md ]; then
            FIRST=$(grep -m1 '^## ' CHANGELOG.md || true)
            if [ "$FIRST" != "## [Unreleased]" ]; then
              touch /tmp/manual_missing_unreleased.txt
            fi
            cp CHANGELOG.md /tmp/CHANGELOG.preview.md
            node ./.github/scripts/materialize-unreleased.cjs /tmp/CHANGELOG.preview.md "$(cat /tmp/next_tag.txt)" "$(date -u +%Y-%m-%d)" > /tmp/manual_release_body.txt
          fi

      - name: Post PR Comment
        env:
          MEMBER_VERSIONS: ${{ needs.workspace.outputs.member-versions }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Per-repo changelog mode: absent or 'auto' = stock generation,
            // 'manual' = human-maintained CHANGELOG.md (materialized release body preview).
            let mode = 'auto';
            try { mode = (fs.readFileSync('.github/changelog-mode', 'utf8').trim() || 'auto'); } catch (e) { /* absent = auto */ }

            // Parse latest maintainer comment for overrides (auto mode only)
            let bumpOverrides = {};
            let changelog = null;
            let noUnreleasedNote = false;
            if (mode !== 'manual') {
              const { data: prComments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const parseSections = function (text) {
                const bumps = {};
                const bumpMatch = text.match(/^## Bump\s*\n([\s\S]*?)(?=(?:^|\n)\s*##(?!#)|(?![\s\S]))/m);
                if (bumpMatch) {
                  bumpMatch[1].split('\n').forEach(function (line) {
                    const parts = line.trim().match(/^([a-z-]+)\s*:\s*(major|minor|patch)$/);
                    if (parts) bumps[parts[1]] = parts[2];
                  });
                }
                const overrideMatch = text.match(/^## Override Changelog\s*\n([\s\S]*?)(?=(?:^|\n)\s*##(?!#)|(?![\s\S]))/m);
                const cl = overrideMatch ? overrideMatch[1].trim() : null;
                return { bumps, cl };
              };
              for (const comment of prComments.reverse()) {
                if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(comment.author_association)) continue;
                const { bumps, cl } = parseSections(comment.body || '');
                if (Object.keys(bumps).length > 0) bumpOverrides = bumps;
                if (cl) changelog = cl;
                if (Object.keys(bumpOverrides).length > 0 || changelog) break;
              }

              // If no changelog override, use the auto-generated one
              if (!changelog) {
                const skipped = fs.readFileSync('/tmp/skipped.txt', 'utf8').trim();
                if (skipped === 'true') {
                  console.log('Changelog skipped — nothing to preview');
                  return;
                }
                try {
                  changelog = fs.readFileSync('CHANGELOG_PREVIEW.md', 'utf8').trim();
                } catch (e) {
                  changelog = '';
                }
              }
            } else {
              // manual mode: show the materialized release body (what the release will post)
              const skipped = fs.readFileSync('/tmp/skipped.txt', 'utf8').trim();
              if (skipped !== 'true') {
                try {
                  changelog = fs.readFileSync('/tmp/manual_release_body.txt', 'utf8').trim() || null;
                } catch (e) { changelog = null; }
                noUnreleasedNote = fs.existsSync('/tmp/manual_missing_unreleased.txt');
              }
            }

            const tag = (function () {
              try {
                const t = fs.readFileSync('/tmp/next_tag.txt', 'utf8').trim();
                return t || null;
              } catch (e) { return null; }
            })();

            if (!tag && !changelog) {
              console.log('No tag and no changelog override');
              return;
            }

            // Build member versions from workspace output or override
            let memberVersions = {};
            if (Object.keys(bumpOverrides).length > 0) {
              memberVersions = bumpOverrides;
            } else if (process.env.MEMBER_VERSIONS) {
              try {
                memberVersions = JSON.parse(process.env.MEMBER_VERSIONS);
              } catch (e) { /* ignore parse errors */ }
            }

            let commentBody = '## Release Preview\n\n';
            if (tag) {
              commentBody += '**Next version:** `' + tag + '`\n\n';
            }
            if (noUnreleasedNote) {
              commentBody += '> **Note:** CHANGELOG.md has no `## [Unreleased]` section. An empty one was created for this preview — add your entries under it to preview the release body.\n\n';
            }

            const memberNames = Object.keys(memberVersions);
            if (memberNames.length > 0) {
              commentBody += '**Crates to bump:**\n';
              commentBody += '| Crate | Current | Bump |\n|-------|---------|------|\n';
              memberNames.forEach(function (m) {
                const val = memberVersions[m];
                if (val.includes(':')) {
                  const [current, bumped] = val.split(':');
                  commentBody += '| ' + m + ' | `' + current + '` | `' + bumped + '` |\n';
                } else {
                  commentBody += '| ' + m + ' | `-` | `' + val + '` |\n';
                }
              });
              commentBody += '\n';
            }

            if (changelog) {
              commentBody += changelog;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(function (c) {
              return c.user.type === 'Bot' && c.body.startsWith('## Release Preview');
            });

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
