[package]
name = "settings"
version = "0.1.0"
edition = "2024"
authors = ["FAZuH <mail@fazuh.com>"]
description = "The settings core plugin for pwr-bot: server settings toggles served as a plugin view"
license = "MIT"
repository = "https://github.com/FAZuH/pwr-bot"

[dependencies]
pwr-ext = { git = "https://github.com/FAZuH/pwr-ext", branch = "main", features = ["macros"] }
pwr-plugin-protocol = { path = "../../pwr-plugin-protocol" }
serde_json = "1.0.149"

[dev-dependencies]
# Only the tests read `IS_COMPONENTS_V2`; production is `view!`-authored.
pwr-poise-components = { path = "../../pwr-poise-components" }
