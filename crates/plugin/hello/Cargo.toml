[package]
name = "hello"
version = "0.1.0"
edition = "2024"
authors = ["FAZuH <mail@fazuh.com>"]
license = "MIT"
repository = "https://github.com/FAZuH/pwr-bot"

[dependencies]
pwr-ext = { git = "https://github.com/FAZuH/pwr-ext", branch = "main", features = ["macros"] }
pwr-plugin-protocol = { path = "../../pwr-plugin-protocol" }
pwr-plugin-support = { path = "../pwr-plugin-support" }
serde_json = "1.0.149"

[dev-dependencies]
pwr-plugin-protocol = { path = "../../pwr-plugin-protocol" }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["process", "io-util", "time", "macros", "rt-multi-thread"] }
