[package]
name = "pwr-test-support"
version = "0.1.0"
edition = "2024"
authors = ["FAZuH <mail@fazuh.com>"]
description = "Shared test support for pwr-bot: test-database provisioning"
license = "MIT"
repository = "https://github.com/FAZuH/pwr-bot"

[dependencies]
dotenv = "0.15.0"
libc = "0.2.182"
postgresql_embedded = { version = "=0.20.1", default-features = false, features = ["zonky", "tokio", "rustls"] }
tokio = { version = "1.49.0", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "native-certs"] }

[dev-dependencies]
serial_test = "3.3.1"
