[package]
name = "pwr-poise-components"
version = "0.1.0"
edition = "2024"
authors = ["FAZuH <mail@fazuh.com>"]
description = "Poise-free builders for Discord message components used by pwr-bot plugins"
license = "MIT"
repository = "https://github.com/FAZuH/pwr-bot"

[dependencies]
poise = { git = "https://github.com/FAZuH/poise", rev = "d3348676d92d9fb1cec3b68ee722850ff000fd26", features = ["view-macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
pwr-plugin-protocol = { path = "../pwr-plugin-protocol" }
