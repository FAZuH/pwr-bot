[package]
name = "pwr-poise-components"
version = "0.1.0"
edition = "2024"
authors = ["FAZuH <mail@fazuh.com>"]
description = "Poise-free builders for Discord message components used by pwr-bot plugins"
license = "MIT"
repository = "https://github.com/FAZuH/pwr-bot"

[dependencies]
poise = { git = "https://github.com/FAZuH/poise", rev = "c8d5fed0dd56ce0d827125f7a6e70ea0c26c4b40", features = ["view-macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
pwr-plugin-protocol = { path = "../pwr-plugin-protocol" }
