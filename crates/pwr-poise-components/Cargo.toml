[package]
name = "pwr-poise-components"
version = "0.1.0"
edition = "2024"
authors = ["FAZuH <mail@fazuh.com>"]
description = "Poise-free builders for Discord message components used by pwr-bot plugins"
license = "MIT"
repository = "https://github.com/FAZuH/pwr-bot"

[dependencies]
pwr-ext = { path = "../../../pwr-ext", features = ["macros"] }
pwr-plugin-protocol = { path = "../pwr-plugin-protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
