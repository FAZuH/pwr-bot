[package]
name = "pwr-bot-plugin-voice"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Voice channel tracking plugin for pwr-bot"

[dependencies]
pwr-bot-sdk = { path = "../pwr_bot_sdk" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
